<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Financial News{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #ffffff;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }
        header .tagline {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }
        main {
            padding: 0;
        }
        .headline-row {
            padding: 18px 0;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: baseline;
            gap: 20px;
            transition: background-color 0.2s;
        }
        .headline-row:hover {
            background-color: #f8f8f8;
        }
        .headline-row .time {
            font-size: 0.85rem;
            color: #999;
            font-family: 'Courier New', monospace;
            min-width: 120px;
            flex-shrink: 0;
        }
        .headline-row .source {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 140px;
            flex-shrink: 0;
            font-weight: 600;
        }
        .headline-row .title {
            flex-grow: 1;
        }
        .headline-row .title a {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.4;
        }
        .headline-row .title a:hover {
            color: #0066cc;
            text-decoration: underline;
        }
        .category-filter {
            margin-bottom: 30px;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .category-filter a {
            display: inline-block;
            padding: 6px 14px;
            margin-right: 10px;
            margin-bottom: 8px;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .category-filter a:hover, .category-filter a.active {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }
        .pagination a, .pagination span {
            padding: 8px 14px;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        .pagination .current {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
        .pagination a:hover {
            background-color: #f0f0f0;
        }
        .no-articles {
            padding: 60px 20px;
            text-align: center;
            color: #999;
            font-style: italic;
        }
        @media (max-width: 768px) {
            .headline-row {
                flex-direction: column;
                gap: 8px;
            }
            .headline-row .time,
            .headline-row .source {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Financial News</h1>
        <div class="tagline">Real-time headlines from premium sources</div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
